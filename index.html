<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Event Check-in</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #dbe2ea;
      --primary: #111827;
      --primary-text: #ffffff;
      --secondary: #eef2f7;
      --secondary-text: #111827;
      --danger: #fee2e2;
      --danger-text: #7f1d1d;
      --success-bg: #ecfdf3;
      --success-text: #166534;
      --warn-bg: #fffbeb;
      --warn-text: #92400e;
      --error-bg: #fef2f2;
      --error-text: #991b1b;
      --info-bg: #eff6ff;
      --info-text: #1d4ed8;
      --shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
      --radius: 18px;
      --radius-sm: 14px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      padding: 16px;
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      display: grid;
      gap: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    h1, h2 {
      margin: 0 0 10px;
      line-height: 1.2;
    }

    h1 {
      font-size: 20px;
      font-weight: 800;
    }

    h2 {
      font-size: 17px;
      font-weight: 800;
    }

    p {
      margin: 0;
    }

    .muted {
      color: var(--muted);
      font-size: 14px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-size: 13px;
      font-weight: 700;
      color: #374151;
    }

    input,
    select,
    button {
      width: 100%;
      margin-top: 6px;
      min-height: 52px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      font-size: 17px;
      font-family: inherit;
    }

    input,
    select {
      background: #fff;
      color: var(--text);
    }

    button {
      border: none;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .primary {
      background: var(--primary);
      color: var(--primary-text);
    }

    .secondary {
      background: var(--secondary);
      color: var(--secondary-text);
    }

    .danger {
      background: var(--danger);
      color: var(--danger-text);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .status {
      margin-top: 14px;
      padding: 14px;
      border-radius: var(--radius-sm);
      background: #f9fafb;
      border: 1px solid var(--border);
    }

    .status.success {
      background: var(--success-bg);
      color: var(--success-text);
      border-color: #bbf7d0;
    }

    .status.warn {
      background: var(--warn-bg);
      color: var(--warn-text);
      border-color: #fde68a;
    }

    .status.error {
      background: var(--error-bg);
      color: var(--error-text);
      border-color: #fecaca;
    }

    .status.info {
      background: var(--info-bg);
      color: var(--info-text);
      border-color: #bfdbfe;
    }

    .status-line {
      font-size: 15px;
      font-weight: 800;
    }

    .big {
      font-size: 24px;
      font-weight: 900;
      margin-top: 6px;
      line-height: 1.15;
    }

    .meta {
      margin-top: 6px;
      font-size: 14px;
      line-height: 1.4;
      color: inherit;
      opacity: 0.95;
    }

    .helper {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    video {
      width: 100%;
      margin-top: 12px;
      border-radius: var(--radius);
      background: #000;
      display: none;
      overflow: hidden;
    }

    .results {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .result {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      background: #fff;
    }

    .result-top {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      align-items: flex-start;
    }

    .result-name {
      font-weight: 800;
      font-size: 16px;
    }

    .result-sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      word-break: break-word;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 800;
      background: #eef2f7;
      color: #374151;
      border: 1px solid #dbe2ea;
    }

    .pill.ok {
      background: #dcfce7;
      color: #166534;
      border-color: #bbf7d0;
    }

    .pill.warn {
      background: #fef3c7;
      color: #92400e;
      border-color: #fde68a;
    }

    .section-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 800;
      background: #eef2f7;
      color: #374151;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 480px) {
      .row {
        grid-template-columns: 1fr;
      }

      .result-top {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="section-top">
        <h1>Event Check-in</h1>
        <span class="badge" id="stationBadge">Desk</span>
      </div>
      <p class="muted">Reception-only scanning, manual search, and undo.</p>

      <label for="pin">Daily PIN</label>
      <input id="pin" inputmode="numeric" autocomplete="off" placeholder="Enter daily PIN" />

      <label for="station">Station</label>
      <select id="station">
        <option>Front Desk A</option>
        <option>Front Desk B</option>
      </select>

      <label for="day">Day</label>
      <select id="day">
        <option value="CheckIn_Monday">Monday</option>
        <option value="CheckIn_Tuesday">Tuesday</option>
      </select>

      <div class="row" style="margin-top: 14px;">
        <button class="primary" id="startBtn">Start scanning</button>
        <button class="secondary hidden" id="stopBtn">Stop scanning</button>
      </div>

      <video id="video" playsinline muted></video>

      <div class="status info" id="statusBox">
        <div class="status-line" id="statusLine">Ready.</div>
        <div class="big" id="nameLine"></div>
        <div class="meta" id="metaLine"></div>
      </div>

      <div class="row" style="margin-top: 12px;">
        <button class="danger" id="undoBtn" disabled>Undo last check-in</button>
        <button class="secondary" id="clearBtn">Clear</button>
      </div>

      <div class="helper" id="undoInfo">No check-in to undo yet.</div>
    </div>

    <div class="card">
      <h2>Manual search</h2>
      <p class="muted">Search by first name, last name, token, or type.</p>

      <input id="searchBox" autocomplete="off" placeholder="Search name, token, VD, or OBS…" />
      <button class="secondary" id="searchBtn">Search</button>

      <div class="results" id="results"></div>
    </div>
  </div>

  <script type="module">
    // Replace this with your deployed Apps Script /exec URL.
    const ENDPOINT = "https://script.google.com/macros/s/AKfycbxQqzRvxJU3bHEod57M5Vqr9RlXQPXKYTcW2zcn6enGu_fABQE3WWRSIp655OHqUPOOVA/exec";

    import QrScanner from "https://unpkg.com/qr-scanner@1.4.2/qr-scanner.min.js";
    QrScanner.WORKER_PATH = "https://unpkg.com/qr-scanner@1.4.2/qr-scanner-worker.min.js";

    const pinEl = document.getElementById("pin");
    const stationEl = document.getElementById("station");
    const dayEl = document.getElementById("day");
    const stationBadgeEl = document.getElementById("stationBadge");

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const videoEl = document.getElementById("video");

    const statusBox = document.getElementById("statusBox");
    const statusLine = document.getElementById("statusLine");
    const nameLine = document.getElementById("nameLine");
    const metaLine = document.getElementById("metaLine");

    const undoBtn = document.getElementById("undoBtn");
    const undoInfo = document.getElementById("undoInfo");
    const clearBtn = document.getElementById("clearBtn");

    const searchBox = document.getElementById("searchBox");
    const searchBtn = document.getElementById("searchBtn");
    const resultsEl = document.getElementById("results");

    let scanner = null;
    let isHandlingScan = false;

    pinEl.value = localStorage.getItem("daily_pin") || "";
    stationEl.value = localStorage.getItem("station") || stationEl.value;
    dayEl.value = localStorage.getItem("day") || dayEl.value;

    let lastCheckin = JSON.parse(localStorage.getItem("last_checkin") || "null");
    refreshUndoUI();
    updateStationBadge();
    setDefaultDayIfEmpty();

    stationEl.addEventListener("change", () => {
      localStorage.setItem("station", stationEl.value);
      updateStationBadge();
    });

    dayEl.addEventListener("change", () => {
      localStorage.setItem("day", dayEl.value);
      refreshUndoUI();
    });

    function setDefaultDayIfEmpty() {
      if (localStorage.getItem("day")) return;
      const weekday = new Date().getDay();
      if (weekday === 1) dayEl.value = "CheckIn_Monday";
      if (weekday === 2) dayEl.value = "CheckIn_Tuesday";
      localStorage.setItem("day", dayEl.value);
    }

    function updateStationBadge() {
      stationBadgeEl.textContent = stationEl.value || "Desk";
    }

    function prettyDay(dayValue) {
      if (dayValue === "CheckIn_Monday") return "Monday";
      if (dayValue === "CheckIn_Tuesday") return "Tuesday";
      return dayValue || "";
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c]));
    }

    function setStatus(kind, statusText, name = "", meta = "") {
      statusBox.className = "status";
      if (kind) statusBox.classList.add(kind);

      statusLine.textContent = statusText || "";
      nameLine.textContent = name || "";
      metaLine.textContent = meta || "";
    }

    function clearStatus() {
      setStatus("info", "Ready.", "", "");
    }

    function refreshUndoUI() {
      if (
        lastCheckin &&
        lastCheckin.token &&
        lastCheckin.day === dayEl.value
      ) {
        undoBtn.disabled = false;
        undoInfo.textContent = `Last check-in for ${prettyDay(lastCheckin.day)}: ${lastCheckin.token}`;
      } else if (lastCheckin && lastCheckin.token) {
        undoBtn.disabled = true;
        undoInfo.textContent = `Last check-in was for ${prettyDay(lastCheckin.day)}. Switch days to undo it.`;
      } else {
        undoBtn.disabled = true;
        undoInfo.textContent = "No check-in to undo yet.";
      }
    }

    async function apiCall(payload) {
      const pin = pinEl.value.trim();
      const station = stationEl.value;
      const day = dayEl.value;

      if (!ENDPOINT || ENDPOINT === "PASTE_YOUR_WEB_APP_URL_HERE") {
        throw new Error("Add your Apps Script web app URL to ENDPOINT first.");
      }

      if (!pin) {
        throw new Error("Enter PIN first.");
      }

      localStorage.setItem("daily_pin", pin);
      localStorage.setItem("station", station);
      localStorage.setItem("day", day);

      const response = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          ...payload,
          pin,
          station,
          day
        })
      });

      return await response.json();
    }

    async function doCheckin(token) {
      try {
        setStatus("info", "Checking in…", "", token);
        const data = await apiCall({ action: "checkin", token });

        if (data.status === "checked_in") {
          const displayName = data.type ? `${data.name} (${data.type})` : data.name;
          setStatus(
            "success",
            "✅ Checked in",
            displayName,
            `${data.day} • ${data.time} • ${data.station}`
          );

          lastCheckin = { token, day: dayEl.value };
          localStorage.setItem("last_checkin", JSON.stringify(lastCheckin));
          refreshUndoUI();

          if (navigator.vibrate) navigator.vibrate(100);
          return;
        }

        if (data.status === "already_checked_in") {
          const displayName = data.type ? `${data.name} (${data.type})` : data.name;
          setStatus(
            "warn",
            "⚠️ Already checked in",
            displayName,
            `${data.day} • First check-in: ${data.time}`
          );
          return;
        }

        if (data.status === "not_found") {
          setStatus("error", "❌ Not found", "", "This QR code is not in the attendee list.");
          return;
        }

        if (data.status === "unauthorized") {
          setStatus("error", "🔒 Invalid PIN", "", "Ask for today's PIN.");
          return;
        }

        setStatus("error", "❌ Error", "", data.message || "Unknown error.");
      } catch (error) {
        setStatus("error", "❌ Error", "", error.message || String(error));
      }
    }

    async function doUndo() {
      if (!lastCheckin || !lastCheckin.token) return;

      try {
        setStatus("info", "Undoing…", "", lastCheckin.token);
        const data = await apiCall({
          action: "undo",
          token: lastCheckin.token
        });

        if (data.status === "undone") {
          const displayName = data.type ? `${data.name} (${data.type})` : data.name;
          setStatus("success", "↩️ Undone", displayName, data.message || "");

          lastCheckin = null;
          localStorage.removeItem("last_checkin");
          refreshUndoUI();
          return;
        }

        if (data.status === "not_checked_in") {
          const displayName = data.type ? `${data.name} (${data.type})` : data.name;
          setStatus("warn", "⚠️ Not checked in", displayName, data.message || "");
          return;
        }

        setStatus("error", "❌ Error", "", data.message || "Undo failed.");
      } catch (error) {
        setStatus("error", "❌ Error", "", error.message || String(error));
      }
    }

    function renderResults(results) {
      resultsEl.innerHTML = "";

      if (!results.length) {
        resultsEl.innerHTML = `<div class="muted">No results.</div>`;
        return;
      }

      for (const r of results) {
        const selectedDay = dayEl.value;
        const checkedIn = selectedDay === "CheckIn_Monday" ? r.mondayCheckedIn : r.tuesdayCheckedIn;
        const time = selectedDay === "CheckIn_Monday" ? r.mondayTime : r.tuesdayTime;
        const pillClass = checkedIn ? "ok" : "warn";
        const pillText = checkedIn ? "Checked in" : "Not checked in";

        const item = document.createElement("div");
        item.className = "result";
        item.innerHTML = `
          <div class="result-top">
            <div>
              <div class="result-name">${escapeHtml(r.name)}${r.type ? ` (${escapeHtml(r.type)})` : ""}</div>
              <div class="result-sub">
                Token: ${escapeHtml(r.token)}<br>
                Monday: ${r.mondayCheckedIn ? escapeHtml(r.mondayTime) : "Not checked in"}<br>
                Tuesday: ${r.tuesdayCheckedIn ? escapeHtml(r.tuesdayTime) : "Not checked in"}
              </div>
            </div>
            <span class="pill ${pillClass}">${pillText}</span>
          </div>
        `;

        const button = document.createElement("button");
        button.className = "secondary";
        button.style.marginTop = "10px";
        button.textContent = checkedIn ? `Already checked in for ${prettyDay(selectedDay)}` : `Check in for ${prettyDay(selectedDay)}`;
        button.disabled = checkedIn;
        button.addEventListener("click", () => doCheckin(r.token));

        item.appendChild(button);
        resultsEl.appendChild(item);
      }
    }

    async function doSearch() {
      const query = searchBox.value.trim();
      resultsEl.innerHTML = "";

      if (!query) {
        clearStatus();
        return;
      }

      try {
        setStatus("info", "Searching…", "", query);
        const data = await apiCall({ action: "search", query });

        if (data.status !== "ok") {
          setStatus("error", "❌ Search error", "", data.message || "Unknown error.");
          return;
        }

        clearStatus();
        renderResults(data.results || []);
      } catch (error) {
        setStatus("error", "❌ Error", "", error.message || String(error));
      }
    }

    async function startScanner() {
      try {
        if (!pinEl.value.trim()) {
          setStatus("warn", "Enter PIN first.", "", "");
          return;
        }

        if (!scanner) {
          scanner = new QrScanner(videoEl, async (result) => {
            if (isHandlingScan) return;

            const token = String(result?.data || result || "").trim();
            if (!token) return;

            isHandlingScan = true;
            scanner.stop();

            try {
              await doCheckin(token);
            } finally {
              setTimeout(async () => {
                try {
                  await scanner.start();
                  setStatus("info", "Scanning…", "", `Point camera at QR code for ${prettyDay(dayEl.value)}`);
                } catch (e) {
                  setStatus("error", "❌ Camera error", "", "Could not restart scanner.");
                } finally {
                  isHandlingScan = false;
                }
              }, 900);
            }
          });
        }

        videoEl.style.display = "block";
        startBtn.classList.add("hidden");
        stopBtn.classList.remove("hidden");

        setStatus("info", "Starting camera…", "", "");
        await scanner.start();
        setStatus("info", "Scanning…", "", `Point camera at QR code for ${prettyDay(dayEl.value)}`);
      } catch (error) {
        videoEl.style.display = "none";
        startBtn.classList.remove("hidden");
        stopBtn.classList.add("hidden");
        setStatus("error", "❌ Camera error", "", "Allow camera permissions and try again.");
      }
    }

    function stopScanner() {
      scanner?.stop();
      videoEl.style.display = "none";
      startBtn.classList.remove("hidden");
      stopBtn.classList.add("hidden");
      clearStatus();
    }

    startBtn.addEventListener("click", startScanner);
    stopBtn.addEventListener("click", stopScanner);
    undoBtn.addEventListener("click", doUndo);

    clearBtn.addEventListener("click", () => {
      searchBox.value = "";
      resultsEl.innerHTML = "";
      clearStatus();
    });

    searchBtn.addEventListener("click", doSearch);
    searchBox.addEventListener("keydown", (event) => {
      if (event.key === "Enter") doSearch();
    });

    clearStatus();
  </script>
</body>
</html>
